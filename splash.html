<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Dead West Railway</title>
    <style>
      :root {
        --ink: #140b06;
        --brass: #d0b46c;
        --brass-hi: #fce08c;
        --brass-lo: #846830;
        --paper: #ecc878;
        --blood: #c05858;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: 'Courier New', monospace;
        user-select: none;
      }
      body {
        display: grid;
        place-items: center;
        background:
          linear-gradient(to bottom, transparent 62%, #3a1808 62%, #3a1808 63%, transparent 63%),
          radial-gradient(ellipse at 50% 120%, #4a2410 0%, var(--ink) 60%);
      }
      main {
        text-align: center;
        padding: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 6vw, 56px);
        letter-spacing: 0.08em;
        color: var(--brass-hi);
        text-shadow: 4px 4px 0 var(--brass-lo);
      }
      .tagline {
        margin: 0 0 40px;
        font-size: 14px;
        letter-spacing: 0.2em;
        color: var(--brass);
      }
      .status {
        font-size: 15px;
        letter-spacing: 0.15em;
      }
      .detail {
        margin-top: 10px;
        font-size: 13px;
        color: var(--brass);
      }
      .dots::after {
        content: '';
        animation: dots 1.5s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }
      a.button {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 22px;
        border: 2px solid var(--brass);
        background: linear-gradient(var(--brass-hi), var(--brass));
        color: var(--ink);
        font-weight: bold;
        letter-spacing: 0.15em;
        text-decoration: none;
        box-shadow: 4px 4px 0 #000;
      }
      a.button:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #000;
      }
      [hidden] {
        display: none !important;
      }
      .offline .status {
        color: var(--blood);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DEAD WEST RAILWAY</h1>
      <p class="tagline">THE LINE REMEMBERS.</p>
      <section id="waking">
        <div class="status dots">WAKING THE LINE</div>
        <div class="detail">The first train of the day takes a few seconds to get up steam.</div>
      </section>
      <section id="offline" class="offline" hidden>
        <div class="status">NO ANSWER ON THE WIRE</div>
        <div class="detail">
          The server can't be reached. Check your connection, then try again.
        </div>
        <a class="button" href="#retry">TRY AGAIN</a>
      </section>
    </main>
    <script>
      const offline = new URLSearchParams(location.search).get('state') === 'offline';
      document.getElementById('waking').hidden = offline;
      document.getElementById('offline').hidden = !offline;
    </script>
  </body>
</html>
